name: Validate with hassfest

on:
  push:
  pull_request:
#  schedule:
#    - cron:  '0 0 * * *'

permissions:
  contents: read
  statuses: write

jobs:
  validate:
    runs-on: "ubuntu-latest"
    steps:
        - uses: "actions/checkout@v4"
        - uses: "home-assistant/actions/hassfest@master"
        - name: Report required status
          if: success()
          uses: actions/github-script@v7
          with:
            script: |
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: context.sha,
                state: "success",
                context: "Validate with hassfest / validate",
                description: "hassfest validation passed"
              });
